# Definindo o nome do Workflow
name: Test Workflow

# Definindo quando o Workflow será disparado
on:
  push:
    branches: [ main, developer ]

# Definindo os jobs que o workflow executará
jobs:
  test_job:
    name: Executando o Job de Teste
    runs-on: ubuntu-latest
    steps:
    - name: Step 1
      uses: actions/checkout@v2

    - name: Docker Login
      uses: docker/login-action@v4.6.0
      with:
        username: 'brnmatos'
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and Push Docker images
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        tags: 'brnmatos/fiap-ghactions:latest'
        push: true
